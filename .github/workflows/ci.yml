name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate build metadata
        id: metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:7}"
          BUILD_ID="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          mkdir -p build
          {
            echo "build_id=$BUILD_ID"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "commit=$SOURCE_SHA"
            echo "short_commit=$SHORT_SHA"
            echo "branch=$SOURCE_BRANCH"
            echo "event=$GITHUB_EVENT_NAME"
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_url=$RUN_URL"
            echo "created_utc=$BUILT_AT"
          } > build/build-info.txt

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          echo "Build ID: $BUILD_ID"
          echo "Source commit: $SOURCE_SHA"
          echo "Source branch: $SOURCE_BRANCH"
          echo "Run: $RUN_URL"
          echo "::notice title=Build ID::$BUILD_ID"

          {
            echo "### Build traceability"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Build ID | \`$BUILD_ID\` |"
            echo "| Source commit | \`$SOURCE_SHA\` |"
            echo "| Source branch | \`$SOURCE_BRANCH\` |"
            echo "| Run attempt | \`$GITHUB_RUN_ATTEMPT\` |"
            echo "| Created (UTC) | $BUILT_AT |"
            echo "| Run | $RUN_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify build metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s build/build-info.txt
          grep -Fx "build_id=$BUILD_ID" build/build-info.txt
          grep -Fx "commit=$SOURCE_SHA" build/build-info.txt
          grep -Fx "branch=$SOURCE_BRANCH" build/build-info.txt
          grep -Fx "run_id=$GITHUB_RUN_ID" build/build-info.txt
          grep -Fx "run_attempt=$GITHUB_RUN_ATTEMPT" build/build-info.txt
          echo "Build metadata validation passed."

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/requirements-sprint2-tested.txt pytest "pytest-cov>=7,<8"
          pip install -e .
          pip install -c backend/requirements-sprint2-tested.txt -r backend/requirements.txt

      - name: Validate Python code
        run: python -m compileall -q .

      - name: Build Python distribution
        run: python -m pip wheel --no-deps . --wheel-dir build/dist

      - name: Run automated tests
        id: tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -v --junitxml=build/test-results.xml \
            --cov --cov-config=.coveragerc \
            --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Publish coverage summary
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          echo "### Python line and branch coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage includes backend/app and src/sportsbetting. Download the coverage-$BUILD_ID artifact for HTML and XML reports." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.metadata.outputs.build_id }}
          path: |
            build/coverage.xml
            build/coverage-html/
          if-no-files-found: error
          retention-days: 30

      - name: Run Sprint 3 ML training smoke test
        env:
          PYTHONPATH: backend
        run: python -m app.ml.run_sport_aware_smoke

      - name: Upload Sprint 3 ML smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-smoke-${{ env.BUILD_ID }}
          path: build/sprint3-ml-smoke/report.json
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ steps.metadata.outputs.build_id }}
          path: build/test-results.xml

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.build_id }}
          path: |
            build/build-info.txt
            build/dist/*.whl

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

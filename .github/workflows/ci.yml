name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate build metadata
        id: metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash .github/scripts/build-metadata.sh

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/requirements-sprint2-tested.txt pytest "pytest-cov>=7,<8"
          pip install -e .
          pip install -c backend/requirements-sprint2-tested.txt -r backend/requirements.txt

      - name: Validate Python code
        run: python -m compileall -q .

      - name: Build Python distribution
        run: python -m pip wheel --no-deps . --wheel-dir build/dist

      - name: Run automated tests
        id: tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -v --junitxml=build/test-results.xml \
            --cov --cov-config=.coveragerc \
            --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Publish coverage summary
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          echo "### Python line and branch coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage includes backend/app and src/sportsbetting. Download the coverage-$BUILD_ID artifact for HTML and XML reports." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.metadata.outputs.build_id }}
          path: |
            build/coverage.xml
            build/coverage-html/
          if-no-files-found: error
          retention-days: 30

      - name: Run Sprint 3 ML training smoke test
        env:
          PYTHONPATH: backend
        run: python -m app.ml.run_sport_aware_smoke

      - name: Upload Sprint 3 ML smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-smoke-${{ env.BUILD_ID }}
          path: build/sprint3-ml-smoke/report.json
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ steps.metadata.outputs.build_id }}
          path: build/test-results.xml

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.build_id }}
          path: |
            build/build-info.txt
            build/dist/*.whl

  auth-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sprint4_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: sportsbetting_sprint4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sprint4_test -d sportsbetting_sprint4_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      SPRINT4_TEST_DATABASE_URL: postgresql+psycopg2://sprint4_test:disposable_ci_only@127.0.0.1:5432/sportsbetting_sprint4_test
      SPRINT4_ALLOW_DISPOSABLE_TEST: "1"
      SPRINT4_REQUIRE_POSTGRES: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing backend dependencies
        run: python -m pip install -c backend/requirements-sprint2-tested.txt -r backend/requirements.txt
      - name: Run U1.1-U1.4 against SQLite and disposable PostgreSQL
        run: python -m pytest backend/tests/test_auth_security.py backend/tests/test_auth_policy.py -v --junitxml=build/sprint4/auth-results.xml
      - name: Verify real HTTPS cookies and CSRF behavior
        run: python -m app.security_tls_smoke
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint4-auth-${{ github.sha }}
          path: build/sprint4/
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate build metadata
        id: metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash .github/scripts/build-metadata.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend component and mocked API regression tests (SCRUM-194)
        working-directory: frontend
        run: npm test

      - name: Upload frontend component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint5-component-tests-${{ github.sha }}
          path: |
            build/sprint5-qa/component-results.xml
            build/sprint5-qa/component-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Include frontend build metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -s build/build-info.txt
          cp build/build-info.txt frontend/dist/build-info.txt

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ steps.metadata.outputs.build_id }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 30

  frontend-browser:
    name: Sprint 5 browser UI and accessibility (mock API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and Chromium/WebKit
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Record browser evidence provenance
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/sprint5-qa
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('build/sprint5-qa/ci-provenance.json', JSON.stringify({source_commit:process.env.SOURCE_SHA, run_id:process.env.GITHUB_RUN_ID, started_utc:new Date().toISOString(), kind:'automated browser UI; mock API; not real database integration'}, null, 2))"
      - name: Test desktop browser paths, keyboard and axe checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser test reports and timestamped screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint5-browser-ui-${{ github.sha }}
          path: build/sprint5-qa/
          if-no-files-found: error
          retention-days: 30

  security-postgres:
    name: Sprint 4 Security + PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vigor_security_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vigor_security_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: vigor_security_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres_test_only
      PGPASSWORD: postgres_test_only
      PYTHONPATH: backend
      SECURITY_POSTGRES_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c backend/requirements-sprint2-tested.txt pytest "pytest-cov>=7,<8"
          python -m pip install -e .
          python -m pip install -c backend/requirements-sprint2-tested.txt -r backend/requirements.txt

      - name: Initialize isolated PostgreSQL schema
        run: |
          psql -h localhost -U postgres -d vigor_security_test \
            -v ON_ERROR_STOP=1 \
            -f backend/app/database/sports_prediction_schema.sql

      - name: Verify security database tables
        shell: bash
        run: |
          set -euo pipefail
          TABLE_COUNT=$(psql -h localhost -U postgres \
            -d vigor_security_test -tAc "
            SELECT COUNT(*)
            FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_name IN (
                'users',
                'user_predictions',
                'matches',
                'teams'
              );
          ")
          test "$TABLE_COUNT" -eq 4
          echo "All four required security tables exist."

      - name: Run Sprint 4 security tests
        run: |
          mkdir -p build
          python -m pytest -v \
            backend/tests/test_auth.py \
            backend/tests/test_password_security.py \
            backend/tests/test_session_security.py \
            backend/tests/test_sprint4_auth_api.py \
            backend/tests/test_login_throttle.py \
            backend/tests/test_ownership_assessment.py \
            backend/tests/test_security_postgres.py \
            --junitxml=build/sprint4-security-results.xml

      - name: Upload Sprint 4 security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint4-security-results
          path: build/sprint4-security-results.xml
          if-no-files-found: warn
          retention-days: 30
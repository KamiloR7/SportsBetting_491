name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate build metadata
        run: |-
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_ID="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          mkdir -p build
          echo "build_id=$BUILD_ID" > build/build-info.txt
          echo "run_number=$GITHUB_RUN_NUMBER" >> build/build-info.txt
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> build/build-info.txt
          echo "commit=$GITHUB_SHA" >> build/build-info.txt
          echo "branch=$GITHUB_REF_NAME" >> build/build-info.txt

          echo "Build ID: $BUILD_ID"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/requirements-sprint2-tested.txt pytest pytest-cov
          pip install -e .
          pip install -c backend/requirements-sprint2-tested.txt -r backend/requirements.txt

      - name: Validate Python code
        run: python -m compileall -q .

      - name: Build Python distribution
        run: python -m pip wheel --no-deps . --wheel-dir build/dist

      - name: Run automated tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -v \
            --junitxml=build/test-results.xml \
            --cov=backend/app/ml \
            --cov-report=term-missing \
            --cov-report=xml:build/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ env.BUILD_ID }}
          path: |
            build/test-results.xml
            build/coverage.xml

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ID }}
          path: |
            build/build-info.txt
            build/dist/*.whl

name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate build metadata
        run: |-
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_ID="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          mkdir -p build
          echo "build_id=$BUILD_ID" > build/build-info.txt
          echo "run_number=$GITHUB_RUN_NUMBER" >> build/build-info.txt
          echo "commit=$GITHUB_SHA" >> build/build-info.txt
          echo "branch=$GITHUB_REF_NAME" >> build/build-info.txt

          echo "Build ID: $BUILD_ID"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r backend/requirements.txt

      - name: Validate Python code
        run: python -m compileall -q .

      - name: Run automated tests
        run: python -m pytest -v

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ID }}
          path: build/build-info.txt